[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "brainrotvision"
version = "0.1.0"
description = "Computer vision pipeline, FastAPI backend, and Flutter client for Italian brainrot image analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "BrainrotVision" }
]
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "imagehash>=4.3.1",
  "joblib>=1.4.2",
  "kaggle>=1.6.17",
  "matplotlib>=3.9.2",
  "notebook>=7.2.2",
  "numpy>=2.1.1",
  "opencv-python-headless>=4.10.0.84",
  "pandas>=2.2.2",
  "pillow>=10.4.0",
  "pyarrow>=17.0.0",
  "pydantic-settings>=2.5.2",
  "python-multipart>=0.0.9",
  "scikit-learn>=1.5.2",
  "scipy>=1.14.1",
  "seaborn>=0.13.2",
  "umap-learn>=0.5.6",
  "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
]

[project.scripts]
brainrotvision = "brainrotvision.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/brainrotvision"]

[tool.pytest.ini_options]
pythonpath = [
  "src",
  ".",
]
testpaths = [
  "tests",
  "backend/tests",
]

[tool.coverage.run]
source = ["src/brainrotvision", "backend/app"]

